name: Deploy React Game to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Using a stable LTS version to keep the runner happy

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        # Using a safer, flat-line execution strategy to prevent shell syntax misinterpretations
        run: npm run build
        env:
          CI: false
          TSC_COMPILE_ON_ERROR: true

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
