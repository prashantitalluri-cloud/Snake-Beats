name: Deploy React Game to Pages

on:
  push:
    branches: ["main"]

# Fixes the deprecation warning by opting into the modern Node 24 runtime environment natively
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Switched to Node 24 to align with the new standard

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project Ignoring Style Warnings
        run: |
          export TSC_COMPILE_ON_ERROR=true
          export CI=false
          npm run build

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
